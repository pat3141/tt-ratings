name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # daily, 4–5am Canberra time
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-download every player (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch latest ratings
        run: node scripts/fetch-data.mjs ${{ inputs.full && '--full' || '' }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "Update ratings data $(date -u +%Y-%m-%d)" && git push
          fi

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
